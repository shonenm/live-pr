version: 2

project_name: live-pr

release:
  prerelease: auto

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: live-pr
    main: .
    binary: live-pr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/shonenm/live-pr/cmd.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: live-pr
    repository:
      owner: shonenm
      name: homebrew-live-pr
      branch: main
      # The workflow's default GITHUB_TOKEN cannot push to another repo, so
      # the tap needs a PAT with contents:write on shonenm/homebrew-live-pr.
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: https://github.com/shonenm/live-pr
    description: Live PR review TUI with a decision timeline for humans and agents
    # Prereleases publish GitHub archives only; the tap tracks stable tags.
    skip_upload: auto
    commit_msg_template: 'live-pr {{ .Tag }}'
    # The binaries are unsigned, so strip Gatekeeper's quarantine bit — the
    # pattern goreleaser documents for CLI casks.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/live-pr"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^docs:'
      - '^test:'
