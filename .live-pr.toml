# Local CI: `R` in the TUI or `live-pr ci run`. See docs/local-ci.md.
[ci.local]
jobs = ["test"]

[ci.local.uses]
# Pin the toolchain to go.mod, as setup-go's go-version-file does remotely.
"actions/setup-go" = 'echo "GOTOOLCHAIN=go$(sed -n "s/^go //p" go.mod)" >> "$GITHUB_ENV"'
# Same pinned version as the workflow's golangci-lint-action.
"golangci/golangci-lint-action" = "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run ./..."
